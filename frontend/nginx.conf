server {
    listen 80;
    root /usr/share/nginx/html;

    location ^~ /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; # necesario para que el streaming de logs (SSE) llegue en vivo
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    # webs estáticas de propuestas: deploy.kaizenfit.es/<slug>[/...]
    # si existe /proposals/<slug>/... se sirve tal cual; si no, cae a la SPA del panel
    location ~ ^/([a-z0-9-]+)(/.*)?$ {
        try_files /proposals/$1$2 /proposals/$1/index.html @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
